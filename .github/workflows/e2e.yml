name: e2e

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: journi-account
  cancel-in-progress: false

jobs:
  import:
    name: Import a journal from Journi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          JOURNI_EMAIL: ${{ secrets.JOURNI_EMAIL }}
          JOURNI_PASSWORD: ${{ secrets.JOURNI_PASSWORD }}
